name: Test workflow

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test python API
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true # Almacena en caché las dependencias automáticamente

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run tom test
        env:
          LLM_PROVIDER: "OPENROUTER"
          OPENROUTER_API_KEY: "sk-or-v1-fake-key-for-ci"
          OPENROUTER_MODEL: "google/gemini-2.5-flash"
          OPENROUTER_AUDIO_MODEL: "openai/gpt-4o-audio-preview"
      - name: Upload coverage to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ✨ NUEVO PASO PARA TEST ANALYTICS
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
