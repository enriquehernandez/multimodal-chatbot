[project]
name = "multimodal-chatbot"
version = "0.1.0"
description = "Chatbot multimodal (texto, audio, imagen) provider-agnostic"
readme = "README.md"
authors = [
    { name = "Enrique Hernández", email = "enrique.hernandez@basedos.cl" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-community<0.4",
    "openai",                     # Para Whisper y TTS directo
    "python-multipart",           # Para subir archivos en FastAPI
    "pillow",                     # Validación de imágenes
    "pydantic-settings",
    "python-dotenv",
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "tomlscript>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "tomlscript>=0.2.1",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-report=xml --junitxml=junit.xml -o junit_family=legacy"
asyncio_default_fixture_loop_scope = "function"

[tool.tomlscript]
dev = "uv run uvicorn app.main:app --reload --port 8002"
test = "uv run pytest tests/ --cov=app --cov-report=term-missing"
test-api = "uv run pytest tests/test_main.py -v"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]